const HELPER_PAGES=new Set(['entry','survey','basicresults','resultconsent','resultview','deepresults']);
let helperPage=null,helperPreviousFocus=null,lastRenderedHelperPage=null;
function drawHelper(){const layer=document.getElementById('helperLayer');const content=document.getElementById('helperContent');const progress=document.getElementById('helperProgress');if(!helperPage){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');document.body.classList.remove('helper-open');lastRenderedHelperPage=null;return;}const pages={entry,survey,basicresults,resultconsent,resultview,deepresults};layer.classList.add('open');layer.setAttribute('aria-hidden','false');document.body.classList.add('helper-open');const phase=helperPage==='entry'?'entry':['survey','basicresults'].includes(helperPage)?'survey':'results';progress.innerHTML=phase==='entry'?'<span class="prog active">시작 방법 선택</span>':`<button class="prog nav" onclick="goto('entry')">‹ 시작 방법</button><span class="arrow">›</span><span class="prog ${phase==='survey'?'active':''}">건강정보 설문</span><span class="arrow">·</span><span class="prog ${phase==='results'?'active':''}">검진결과 연결</span>`;const previousScroll=content.scrollTop;const isSamePage=lastRenderedHelperPage===helperPage;content.innerHTML=(pages[helperPage]||survey)();content.scrollTop=isSamePage?previousScroll:0;lastRenderedHelperPage=helperPage;}
function closeHelper(){helperPage=null;drawHelper();if(helperPreviousFocus&&document.contains(helperPreviousFocus)){helperPreviousFocus.focus()}else{const b=document.querySelector('button[onclick*="survey"]');if(b)b.focus()}}
function goto(page){if(HELPER_PAGES.has(page)){if(!helperPage)helperPreviousFocus=document.activeElement;helperPage=page;drawHelper();return;}helperPage=null;state.page=page;document.getElementById('herowrap').style.display=page==='home'?'':'none';render();window.scrollTo({top:0,behavior:'instant'});}
function btn(label,fn,variant='primary',extra=''){return `<button class="btn ${variant} ${extra}" onclick="${fn}">${label}</button>`}
function crumb(items){return `<div class="breadcrumbs">${items.map((it,i)=>i===items.length-1?`<b>${esc(it)}</b>`:`<span>${esc(it)}</span><span>›</span>`).join('')}</div>`}

function hospitalFilter(){const counts=state.selectedCodes.length;return `<div class="filters"><div class="filtergroup"><select class="field sel" onchange="state.cost=this.value;render()"><option value="전체" ${state.cost==='전체'?'selected':''}>본인부담금 전체</option><option value="30만원 이하" ${state.cost==='30만원 이하'?'selected':''}>30만원 이하</option><option value="30만원 초과" ${state.cost==='30만원 초과'?'selected':''}>30만원 초과</option></select><select class="field sel" onchange="state.region=this.value;render()">${['전체','서울','경기','부산'].map(v=>`<option value="${v}" ${state.region===v?'selected':''}>${v==='전체'?'검진기관 지역':v}</option>`).join('')}</select><select class="field sel" onchange="state.tier=this.value;render()">${['전체','상급종합병원','종합병원','병원','의원','검진전문기관'].map(v=>`<option value="${v}" ${state.tier===v?'selected':''}>${v==='전체'?'규모 전체':v}</option>`).join('')}</select><button class="chip ${state.filtered?'on':''}" onclick="state.filtered=!state.filtered;render()">관련검사 ${counts?counts+'개 ':''}⌄</button></div><input class="field search" placeholder="상품명/병원명/병원주소 검색" value="${esc(state.search)}" oninput="state.search=this.value;render()"></div>${counts?`<div class="rowBetween" style="flex-wrap:wrap;gap:5px"><div class="mini muted">선택한 검사 <b class="counter">${counts}개</b> · ${state.filtered?'포함 상품 필터 적용 중':'필터 적용 전'}</div><div class="pillrow"><label class="mini"><input type="radio" name="match" ${state.matchMode==='any'?'checked':''} onclick="state.matchMode='any';render()"> 하나 이상 포함</label><label class="mini"><input type="radio" name="match" ${state.matchMode==='all'?'checked':''} onclick="state.matchMode='all';render()"> 모두 포함</label></div></div>${tags(state.selectedCodes)}`:''}<div class="rowBetween section"><button class="btn soft small">⇆ 상품 비교하기 (0/3)</button><label class="mini muted"><input type="checkbox"> 본인 부담금 없음</label></div>`}
function findProducts(){return PRODUCTS.filter(p=>{const h=HOSP.find(h=>h.id===p.hid);const all=[...p.base,...p.a,...p.b,...p.extra];let match= !state.filtered||!state.selectedCodes.length||(state.matchMode==='all'?state.selectedCodes.every(c=>all.includes(c)):state.selectedCodes.some(c=>all.includes(c)));return match&&(state.region==='전체'||h.region===state.region)&&(state.tier==='전체'||h.tier===state.tier)&&(state.cost==='전체'||(state.cost==='30만원 이하'?p.price<=300000:p.price>300000))&&(!state.search||`${h.name}${h.address}${p.name}`.includes(state.search));})}

function entry(){const hasBasic=state.basicCodes.length>0,hasResults=state.resultLinked;return `<div class="narrow"><div class="entry-intro"><span class="badge blue">비타체크 · 검사 선택 도우미</span><h2 style="margin-top:10px">어떤 방법으로 시작할까요?</h2><p>간단한 건강정보 설문으로 시작하거나, 과거 검진결과를 바로 연결할 수 있습니다. 두 가지를 모두 이용할 필요는 없습니다.</p></div><div class="entry-options"><button class="entry-card" onclick="goto('${hasBasic?'basicresults':'survey'}')"><span class="entry-icon">☷</span><strong>건강정보 설문으로 시작</strong><span class="entry-description">관심 있는 건강영역을 선택하고 관련 검사항목 정보를 확인해 보세요. 과거 검진결과가 없어도 이용할 수 있습니다.</span><span class="entry-action">${hasBasic?'이전 설문 결과 확인':'간단한 설문 시작'} →</span></button><button class="entry-card" onclick="goto('${hasResults?'resultview':'resultconsent'}')"><span class="entry-icon teal">▤</span><strong>과거 검진결과 바로 연결</strong><span class="entry-description">설문 없이 검진결과 활용 동의부터 진행합니다. 과거 검사이력과 연결된 검사정보를 바로 찾아볼 수 있습니다.</span><span class="entry-action">${hasResults?'연결된 결과 다시 보기':'검진결과 연결하기'} →</span></button></div><div class="entry-foot"><b style="color:#334155">원하는 방법만 이용해도 됩니다.</b><br>선택한 검사는 검진 예약 화면의 관련검사 필터에 반영됩니다. 나중에 다른 방법을 추가해도 기존 선택은 유지됩니다.</div>${state.selectedCodes.length?`<div class="entry-shortcuts">${btn(`선택한 검사 ${state.selectedCodes.length}개로 상품 찾기 →`,"applyToProducts()",'primary wide')}</div>`:''}<div class="footactions">${btn('검사 선택 없이 예약하기',"goto('home')",'')}</div></div>`}
function survey(){const interests=Object.keys(healthChoices);const ready=state.surveyPersonal&&state.questionConsent;return `<div class="narrow">${crumb(['검진 예약','검사 선택 도우미','1단계 · 건강정보 설문'])}<div class="titleblock"><div><h2>건강정보를 알려주세요</h2><p>관심 있는 건강영역을 선택하면 관련 검사항목을 편리하게 찾을 수 있습니다.</p></div><span class="badge blue">STEP 01</span></div><div class="stepper"><span class="step active">01 건강정보 설문</span><span class="step">02 검사정보 확인</span><span class="step">03 관련 상품 찾기</span></div><div class="panel"><div class="notice slimnotice"><strong>약 1분이면 충분합니다</strong><div class="mini">관심영역은 필수이며 다른 문항은 선택해서 답변할 수 있습니다. 설문 중에도 검진 예약으로 돌아갈 수 있습니다.</div></div><div class="question"><div class="qhead">Q1. 관심 있는 건강영역을 선택해 주세요. <span class="mini muted">복수 선택 가능 · 필수</span></div><div class="checks">${interests.map(x=>`<button class="choice ${state.interests.includes(x)?'active':''}" onclick="toggleInterest('${x}')">${x}</button>`).join('')}</div></div><div class="question"><div class="qhead">Q2. 이번 검진에서 어떤 정보를 알고 싶으신가요?</div>${choice('purpose',['전반적인 검진정보','관심 분야 검사 종류','검사 비용 및 상품 비교'])}</div><details class="optionalSurvey" ${state.optionalSurveyOpen?'open':''} ontoggle="state.optionalSurveyOpen=this.open"><summary>생활습관 정보도 입력하기 <span class="muted mini">선택 · 일반 건강관리 정보 제공</span></summary><div class="question"><div class="qhead">Q3. 현재 흡연 상태는 어떠신가요?</div>${choice('smoke',['비흡연','과거 흡연','현재 흡연','응답하지 않음'])}</div><div class="question"><div class="qhead">Q4. 음주 빈도는 어떻게 되나요?</div>${choice('drink',['음주하지 않음','월 1~3회','주 1~2회','주 3회 이상','응답하지 않음'])}</div><div class="question"><div class="qhead">Q5. 일주일에 운동하는 날은 얼마나 되나요?</div>${choice('exercise',['거의 없음','주 1~2일','주 3일 이상','응답하지 않음'])}</div><div class="question"><div class="qhead">Q6. 평균 수면시간은 어느 정도인가요?</div>${choice('sleep',['6시간 미만','6~8시간','8시간 초과','응답하지 않음'])}</div><div class="question"><div class="qhead">Q7. 마지막 종합검진은 언제였나요?</div>${choice('checkup',['1년 이내','1~2년 전','3년 이상','잘 모르겠음'])}</div></details><div class="consentWrap"><div class="rowBetween"><div><b>개인정보 활용 동의</b><p class="mini muted" style="margin:3px 0 0">검사 선택 도우미 이용을 위한 동의입니다. 일반 검진 예약에는 필요하지 않습니다.</p></div><button class="btn soft small" onclick="toggleSurveyAll()">${ready?'전체 동의 해제':'모두 동의하기'}</button></div><div class="compactconsent"><label><input type="checkbox" ${state.surveyPersonal?'checked':''} onchange="state.surveyPersonal=this.checked;render()"> <span>[선택] 설문 개인정보 수집·이용 동의</span></label><details><summary>내용 보기</summary><p><b>처리 주체:</b> 옴니케어　<b>목적:</b> 검사정보 탐색 및 이용내역 관리　<b>항목:</b> 관심영역, 검진정보 탐색 목적, 설문 응답　<b>보유기간:</b> 운영 전 확정·고지　<b>거부 시:</b> 도우미 이용 제한, 일반 검진 예약 가능</p></details></div><div class="compactconsent"><label><input type="checkbox" ${state.questionConsent?'checked':''} onchange="state.questionConsent=this.checked;render()"> <span>[선택] 건강 관련 민감정보 별도 처리 동의</span></label><details><summary>내용 보기</summary><p><b>목적:</b> 건강정보 설문에 기반한 관심 검사정보 탐색　<b>항목:</b> 흡연·음주·운동·수면 등 건강 관련 응답　<b>보유기간:</b> 운영 전 확정·고지　<b>거부 시:</b> 건강정보를 활용한 도우미 이용 제한, 일반 예약 가능</p></details></div></div><div class="footactions">${btn('← 검진 예약으로',"goto('home')",'')}<div>${btn('검사정보 결과 보기 →',"submitSurvey()",'primary')}</div></div></div></div>`}
function toggleInterest(k){state.interests=state.interests.includes(k)?state.interests.filter(x=>x!==k):[...state.interests,k];render()}
function toggleSurveyAll(){const next=!(state.surveyPersonal&&state.questionConsent);state.surveyPersonal=next;state.questionConsent=next;render()}
function submitSurvey(){if(!state.interests.length){toast('관심 건강영역을 하나 이상 선택해 주세요.');return}if(!state.surveyPersonal||!state.questionConsent){toast('검사정보 안내에 필요한 동의 항목을 확인해 주세요.');return}state.basicCodes=[...new Set(state.interests.flatMap(x=>healthChoices[x]||[]))].filter(c=>byCode[c]&&byCode[c].enabled);state.stage='basic';state.selectedCodes=[...new Set(state.selectedCodes.filter(x=>state.basicCodes.includes(x)||state.deepCodes.includes(x)))];goto('basicresults')}
function recItem(code,mode){const o=byCode[code];if(!o)return '';const chosen=state.selectedCodes.includes(code);const t=INFO[code]||o.topic+' 검사정보';return `<div class="recommend ${chosen?'selected':''}"><div class="recrow"><input type="checkbox" ${chosen?'checked':''} onchange="toggleCode('${code}')" aria-label="${esc(o.name)} 선택"><div class="recmain"><div class="labelrow"><strong>${esc(o.name)}</strong><span class="badge blue">검사 선택 도우미</span></div><p>${esc(t)} · 공통코드 ${code} · ${mode==='deep'?'과거 결과에 연결된 검사정보':'선택한 관심영역 관련 검사정보'}</p><button class="linklike mini" onclick="showExamInfo('${code}')">검사정보·표시 근거 보기 ›</button></div></div></div>`}
function toggleCode(c){state.selectedCodes=state.selectedCodes.includes(c)?state.selectedCodes.filter(x=>x!==c):[...state.selectedCodes,c];render()}
function basicresults(){const codes=state.basicCodes;return `<div class="narrow">${crumb(['검진 예약','검사 선택 도우미','1단계 결과'])}<div class="titleblock"><div><h2>검사항목 정보를 확인해 보세요</h2><p>선택하신 <b>${state.interests.map(esc).join(', ')}</b> 분야와 관련된 검사정보입니다.</p></div><span class="badge blue">1단계 결과</span></div><div class="panel"><div class="notice"><b>안내된 항목 중 검진상품에서 찾아볼 검사를 선택해 주세요.</b><div class="mini section" style="margin-top:4px">선택한 관심 주제와 연결된 정보이며 개인별 의학적 검사 필요성 판단은 아닙니다.</div></div><div class="rowBetween section"><h3>검사항목 ${codes.length}개</h3><div>${btn('모두 선택',"pickAll('basic')",'soft small')} ${btn('모두 해제',"clearPick('basic')",'small')}</div></div>${codes.map(c=>recItem(c,'basic')).join('')}<div class="selectedbox section rowBetween"><div><strong>현재 선택 ${state.selectedCodes.length}개</strong><div class="mini muted">관련검사 필터에 다중 반영됩니다.</div></div>${btn('① 선택한 검사 포함 검진상품 보기 →',"applyToProducts()",'primary')}</div><div class="divider"></div><div class="rowBetween" style="align-items:flex-start;flex-wrap:wrap"><div><span class="badge green">선택 서비스</span><h3 style="margin:7px 0">과거 검진결과를 연결하면?</h3><div class="mini muted">원본 검사값과 기관 판정, 검사이력을 확인하고 관련 검사정보를 더 찾아볼 수 있습니다.</div></div>${btn('② 2단계 · 검진결과 활용하기 →',"goto('resultconsent')",'soft')}</div><div class="legal section">과거 검진결과에 따라 새로운 검사 필요성을 자동 결정하거나 진단하는 기능은 포함하지 않습니다. 별도의 수치 기반 의료적 추천 기능은 법률 검토 후 결정해야 합니다.</div></div><div class="footactions">${btn('← 설문 수정',"goto('survey')",'')} ${btn('검진 예약으로',"goto('home')",'')}</div></div>`}
function pickAll(mode){state.selectedCodes=[...new Set([...state.selectedCodes,...(mode==='basic'?state.basicCodes:state.deepCodes)])];render()}
function clearPick(mode){const list=mode==='basic'?state.basicCodes:state.deepCodes;state.selectedCodes=state.selectedCodes.filter(x=>!list.includes(x));render()}
function applyToProducts(){if(!state.selectedCodes.length){toast('검사항목을 하나 이상 선택해 주세요.');return}state.filtered=true;state.matchMode='any';state.opened=1;goto('home')}
function resultconsent(){const x=state.resultConsent;const all=x.collection&&x.sensitive&&x.provided;return `<div class="narrow">${crumb(['검진 예약','검사 선택 도우미','과거 결과 연결'])}<div class="titleblock"><div><h2>과거 검진결과 연결</h2><p>검사 이력과 원본 결과를 확인하고 관련 검사항목을 찾아보세요.</p></div><span class="badge blue">STEP 02</span></div><div class="stepper"><span class="step ${state.basicCodes.length?'done':''}">${state.basicCodes.length?'설문 확인 완료':'설문 생략 가능'}</span><span class="step active">검진결과 연결</span><span class="step">관련 상품 찾기</span></div><div class="panel"><div class="notice"><strong>원하실 때만 연결하세요</strong><div class="mini">과거 검진결과를 연결하지 않아도 1단계 검사정보와 기존 검진 예약을 이용할 수 있습니다.</div></div><div class="section rowBetween"><h3>결과 연결 및 활용 동의</h3><button class="btn soft small" onclick="toggleResultAll()">${all?'전체 동의 해제':'모두 동의하기'}</button></div><div class="compactconsent"><label><input type="checkbox" ${x.collection?'checked':''} onchange="state.resultConsent.collection=this.checked;render()"><span>[선택] 검진결과 수집·이용 동의</span></label><details><summary>내용 보기</summary><p><b>처리 주체:</b> 옴니케어　<b>목적:</b> 과거 검사 이력·결과 조회 및 관련 검사정보 탐색　<b>항목:</b> 검진일, 검사명·코드, 결과값, 기관 판정　<b>보유기간:</b> 운영 전 확정·고지　<b>거부 시:</b> 결과 연결 불가</p></details></div><div class="compactconsent"><label><input type="checkbox" ${x.sensitive?'checked':''} onchange="state.resultConsent.sensitive=this.checked;render()"><span>[선택] 검진결과 민감정보 별도 처리 동의</span></label><details><summary>내용 보기</summary><p><b>목적:</b> 결과·이력 확인　<b>항목:</b> 건강검진 결과값과 제공기관 판정　<b>보유기간:</b> 운영 전 확정·고지　<b>거부 시:</b> 결과 연결 불가</p></details></div><div class="compactconsent"><label><input type="checkbox" ${x.provided?'checked':''} onchange="state.resultConsent.provided=this.checked;render()"><span>[선택] 검진기관의 결과 제3자 제공 동의</span></label><details><summary>내용 보기</summary><p><b>제공하는 자:</b> 실제 결과 제공 검진기관　<b>제공받는 자:</b> 옴니케어　<b>목적:</b> 과거 검진결과 조회·이력관리　<b>제공항목:</b> 검진일, 검사코드, 결과값, 판정정보　<b>보유기간:</b> 제공기관 확정 후 고지　<b>거부 시:</b> 결과 연결 불가</p></details></div><div class="consentHint">위 항목은 개별 선택·해제가 가능하며, '모두 동의하기'에는 광고성 정보 수신 동의가 포함되지 않습니다. 실제 이용 시 제공기관별 동의 절차가 추가될 수 있습니다.</div><div class="footactions">${btn(state.basicCodes.length?'← 설문 결과로':'← 시작 방법으로',state.basicCodes.length?"goto('basicresults')":"goto('entry')",'')} ${btn('검진결과 확인하기 →',"linkResults()",'primary')}</div></div></div>`}
function toggleResultAll(){const x=state.resultConsent;const next=!(x.collection&&x.sensitive&&x.provided);x.collection=next;x.sensitive=next;x.provided=next;render()}
function linkResults(){const x=state.resultConsent;if(!x.sensitive||!x.collection||!x.provided){toast('검진결과 연계에 필요한 동의 항목을 확인해 주세요.');return}state.resultLinked=true;goto('resultview')}
const RESULTS=[{code:'T00084',value:'5.8 %',judgment:'경계',year:'2025.10.15'},{code:'T50149',value:'2.4 μIU/mL',judgment:'정상',year:'2025.10.15'},{code:'T00237',value:'검사 완료',judgment:'기관 판정 원문 확인',year:'2025.10.15'}];
function resultview(){return `<div class="narrow">${crumb(['검진 예약','검사 선택 도우미','검진결과 조회'])}<div class="titleblock"><div><h2>과거 검진결과가 연결되었습니다</h2><p>제공기관의 원본 검사정보를 확인하고 검사항목 선택에 참고해 보세요.</p></div><span class="badge green">결과 연결 완료</span></div><div class="panel"><div class="rowBetween"><div><h3>2025년 종합검진 결과</h3><div class="mini muted">검진기관 제공 판정</div></div><span class="badge green">연결 완료</span></div><div class="resultdata section">${RESULTS.map(r=>`<div class="metric"><small>${esc(byCode[r.code]?.name||r.code)}</small><b>${esc(r.value)}</b><div class="mini muted">제공기관 판정: ${esc(r.judgment)}</div></div>`).join('')}</div><div class="legal section">표시된 결과는 화면 이해를 위한 예시입니다. 결과값의 이상 여부로 추가 검사의 의학적 필요성을 자동 판단하지 않습니다.</div><div class="footactions">${btn('← 결과 동의로',"goto('resultconsent')",'')} ${btn('검진결과 관련 검사정보 확인 →',"deepRecommend()",'primary')}</div></div></div>`}
function deepRecommend(){state.deepCodes=RESULTS.map(x=>x.code).filter(c=>byCode[c]);state.stage='deep';goto('deepresults')}
function deepresults(){return `<div class="narrow">${crumb(['검진 예약','검사 선택 도우미','2단계 결과'])}<div class="titleblock"><div><h2>검진결과와 연결된 검사항목</h2><p>과거 결과에서 확인된 검사와 관련 정보를 표시합니다. 원하는 항목을 선택하세요.</p></div><span class="badge blue">2단계 결과</span></div><div class="panel"><div class="notice"><b>선택한 검사항목을 모두 합쳐 검진상품을 조회할 수 있습니다.</b><div class="mini">공통 검사코드 기준으로 매핑하여 포함 상품을 필터링합니다.</div></div><div class="rowBetween section"><h3>과거 결과와 연결된 항목</h3><span class="mini muted">실제 수치 기반 추가 검사 권고는 포함되지 않음</span></div>${state.deepCodes.map(c=>recItem(c,'deep')).join('')}<div class="selectedbox section rowBetween"><div><strong>총 선택 ${state.selectedCodes.length}개</strong><div class="mini muted">이전 단계 선택과 함께 상품 필터에 적용됩니다.</div></div>${btn('선택한 검사 포함 검진상품 보기 →',"applyToProducts()",'primary')}</div><div class="footactions">${btn('← 검진결과 보기',"goto('resultview')",'')} ${btn(state.basicCodes.length?'설문 결과 보기':'건강정보 설문도 이용하기',state.basicCodes.length?"goto('basicresults')":"goto('survey')",'')}</div></div></div>`}
function showExamInfo(code){const o=byCode[code];modal(`<h3>${esc(o.name)}</h3><div class="labelrow"><span class="badge blue">공통코드 ${code}</span><span class="badge">${esc(o.group)}</span></div><p><b>표시 근거</b><br>${state.deepCodes.includes(code)?'과거 검진결과에 연결된 검사코드 또는 선택된 관심영역 관련 정보':'사용자가 선택한 관심영역 관련 검사항목 정보'}</p><p>검사 목적과 수행 가능 여부는 검진기관의 공식 안내를 확인하세요. 이 정보는 검사 필요성에 관한 의료적 판단이 아닙니다.</p><div class="footactions">${btn('닫기','closeModal()','')} ${btn('검진상품에서 찾기',`quickFilter('${code}')`,'primary')}</div>`)}
function quickFilter(code){state.selectedCodes=[...new Set([...state.selectedCodes,code])];closeModal();applyToProducts()}
function removeFilter(code){state.selectedCodes=state.selectedCodes.filter(x=>x!==code);render()}
function chooseProduct(id){state.product=id;state.examChoices=[];goto('examselect')}
function listExam(group,codes,prod){return `<div class="groupbox"><h3>${group} <span class="mini muted">${group==='기본검사'?'상품에 포함된 항목':group==='선택검사 A'?`최대 ${prod.maxA}개 선택`:group==='선택검사 B'?`최대 ${prod.maxB}개 선택`:'선택 시 추가 비용 발생할 수 있음'}</span></h3>${codes.map(code=>{const o=byCode[code];const related=state.selectedCodes.includes(code);const fixed=group==='기본검사';const selected=state.examChoices.includes(code);return `<div class="exam ${related?'exam-highlight':''}"><div><div class="labelrow"><span class="examname">${esc(o?.name||code)}</span>${related?'<span class="tag">✦ 검사 선택 도우미</span>':''}</div><small>공통코드 ${code}${fixed?' · 기본검사 포함':''}</small></div><div class="rightnav">${group==='추가검사'?`<span class="mini muted">+ ${money(20000+code.length*2000)}</span>`:''}${fixed?'<span class="badge green">포함</span>':`<label class="mini"><input type="checkbox" ${selected?'checked':''} onchange="toggleExam('${code}','${group}')"> 선택</label>`}</div></div>`}).join('')}</div>`}
function toggleExam(code,group){const p=PRODUCTS.find(x=>x.id===state.product);const already=state.examChoices.includes(code);if(already){state.examChoices=state.examChoices.filter(x=>x!==code)}else{if(group==='선택검사 A'&&p.a.filter(x=>state.examChoices.includes(x)).length>=p.maxA){toast('선택검사 A는 최대 '+p.maxA+'개 선택할 수 있습니다.');return}if(group==='선택검사 B'&&p.b.filter(x=>state.examChoices.includes(x)).length>=p.maxB){toast('선택검사 B는 최대 '+p.maxB+'개 선택할 수 있습니다.');return}state.examChoices.push(code)}render()}
function extraPrice(){return state.examChoices.reduce((sum,code)=>{const p=PRODUCTS.find(x=>x.id===state.product);return sum+(p.extra.includes(code)?20000+code.length*2000:0)},0)}
function examselect(){const p=PRODUCTS.find(x=>x.id===state.product),h=HOSP.find(x=>x.id===p.hid),present=[...p.base,...p.a,...p.b,...p.extra].filter(c=>state.selectedCodes.includes(c));return `<div class="columns"><aside class="panel"><div class="person"><small>본인　검진 대상자</small><strong>체험 사용자</strong><small>생년월일 비공개</small></div><h3>발생 비용 안내</h3><div class="summaryline mini"><span>검진상품</span><b>${money(p.price)}</b></div><div class="summaryline mini"><span>추가 선택검사</span><b>${money(extraPrice())}</b></div><div class="divider"></div><div class="summaryline"><b>합계</b><b class="price">${money(p.price+extraPrice())}</b></div><div class="notice mini">선택한 검사와 예상 비용은 예약 신청 전 다시 확인해 주세요.</div></aside><section class="panel"><div class="breadcrumbs"><button class="linklike" onclick="goto('home')">← 검진기관 / 검진상품 선택</button></div><div class="paneltop"><div><h2>${h.name}</h2><div class="mini muted">${p.name} · 검진항목 선택</div></div><span class="badge">${h.tier}</span></div>${present.length?`<div class="selectedbox"><div class="rowBetween"><div><strong>✦ 검사 선택 도우미에서 찾아본 검사 ${present.length}개</strong><div class="mini muted">아래 기본·선택·추가검사 영역에 해당 항목을 강조했습니다.</div></div>${btn('도우미 다시 보기',"goto('entry')",'soft small')}</div>${tags(present)}</div>`:''}${listExam('기본검사',p.base,p)}${listExam('선택검사 A',p.a,p)}${listExam('선택검사 B',p.b,p)}${listExam('추가검사',p.extra,p)}<div class="divider"></div><h3>예약정보</h3><div class="section" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px"><label>예약자명<input class="field" style="width:100%" value="${esc(state.booking.name)}" oninput="state.booking.name=this.value"></label><label>희망 검진일<input type="date" class="field" style="width:100%" value="${esc(state.booking.date)}" onchange="state.booking.date=this.value"></label><label>휴대전화<input class="field" style="width:100%" placeholder="010-0000-0000" value="${esc(state.booking.phone)}" oninput="state.booking.phone=this.value"></label></div><div class="footactions">${btn('← 검진상품 다시 선택',"goto('home')",'')} ${btn('예약 신청하기 →',"submitBooking()",'primary')}</div></section></div>`}
function submitBooking(){const p=PRODUCTS.find(x=>x.id===state.product);if(!state.booking.name.trim()||!state.booking.date||!/^0[0-9 -]{8,13}$/.test(state.booking.phone)){toast('이름, 검진 희망일, 휴대전화번호를 확인해 주세요.');return}if(p.a.filter(x=>state.examChoices.includes(x)).length!==p.maxA||p.b.filter(x=>state.examChoices.includes(x)).length!==p.maxB){toast('선택검사 A/B에서 각각 1개를 선택해 주세요.');return}state.bookingComplete=true;goto('complete')}
function complete(){const p=PRODUCTS.find(x=>x.id===state.product),h=HOSP.find(x=>x.id===p.hid);return `<div class="narrow">${crumb(['검진 예약','예약 신청 완료'])}<div class="panel"><div class="finish"><div class="successicon">✓</div><h2>검진 예약 신청 내용을 확인했습니다</h2><p class="muted">예약 신청 내용을 확인해 주세요. 예약 확정은 검진기관의 최종 확인 이후 안내됩니다.</p><div class="compactlist" style="text-align:left;max-width:520px;margin:20px auto"><div class="summaryline"><span>검진기관</span><strong>${h.name}</strong></div><div class="summaryline"><span>검진상품</span><strong>${p.name}</strong></div><div class="summaryline"><span>검진 희망일</span><strong>${esc(state.booking.date)}</strong></div><div class="summaryline"><span>예상 비용</span><strong>${money(p.price+extraPrice())}</strong></div></div></div><h3>예약 후 건강관리를 이어가세요</h3><p class="muted mini">아래 서비스는 검진 예약과 별도로 선택해 이용할 수 있습니다.</p><div class="servicecards section"><div class="servicecard"><div class="ico">🏥</div><h3>검진기관 주변 진료병원</h3><p>검진기관 인근 의료기관의 진료과목·위치·기관 종별을 살펴보세요.</p>${btn('내 주변 이런 진료는 어떠세요? →',"goto('hospitalconsent')",'soft wide')}</div><div class="servicecard"><div class="ico">⌚</div><h3>건강관리 상품</h3><p>혈압계, 체중계, 활동량계 등 일반 제품정보를 비교해 보세요.</p>${btn('이런 상품은 어떠세요? →',"goto('productconsent')",'soft wide')}</div></div><div class="legal section">검진결과를 근거로 개인에게 필요한 진료기관 또는 제품을 의학적으로 결정하는 기능은 현재 제공하지 않습니다. 건강정보 기반 개인화에는 별도 동의뿐 아니라 적법한 처리 근거와 서비스 행위에 대한 법률 검토가 필요합니다.</div><div class="footactions">${btn('검진 예약 화면으로',"goto('home')",'')} ${btn('처음 화면으로',"resetAll()",'primary')}</div></div></div>`}
function hospitalconsent(){const p=PRODUCTS.find(x=>x.id===state.product),h=HOSP.find(x=>x.id===p.hid);return `<div class="narrow">${crumb(['예약 완료','주변 의료기관 안내'])}<div class="titleblock"><div><span class="badge blue">예약 후 건강관리</span><h2>내 주변 이런 진료는 어떠세요?</h2><p>검진을 받는 ${esc(h.region)} 지역에 어떤 병원들이 있는지 살펴보세요. 진료과목, 의료기관 종류와 거리를 한곳에서 비교할 수 있습니다.</p></div></div><div class="panel"><div class="preview-hero hospital-preview"><div class="preview-icon">🏥</div><div><strong>내 주변 의료기관 한눈에 찾기</strong><p>방문 예정 검진기관을 기준으로 주변 의료기관을 살펴볼 수 있어요.</p></div></div><div class="preview-section"><b>이런 정보를 살펴볼 수 있어요</b><div class="preview-grid"><div><span class="preview-emoji">🩺</span><strong>진료과목별 탐색</strong><small>내과 · 가정의학과 · 정형외과</small></div><div><span class="preview-emoji">📍</span><strong>검진기관 주변</strong><small>${esc(h.region)} 지역의 의료기관 정보</small></div><div><span class="preview-emoji">🏨</span><strong>기관 종류 비교</strong><small>의원 · 병원 · 종합병원</small></div></div></div><div class="gentle-note"><b>더 나에게 맞게 살펴보고 싶다면</b><p>관심 있는 진료과목과 방문 지역을 선택해 의료기관 정보를 좁혀볼 수 있습니다. 의료기관의 실제 진료 적합성은 의료진과 확인해 주세요.</p></div><div class="consentWrap section"><b>서비스 이용 안내</b><p class="mini muted">선택한 검진기관의 위치를 기준으로 일반 의료기관 정보를 안내합니다. 개인 건강검진결과나 질병정보는 이 검색에 사용하지 않습니다.</p><div class="compactconsent"><label><input type="checkbox" ${state.hospitalConsent.sensitive?'checked':''} onchange="state.hospitalConsent.sensitive=this.checked"><span>[선택] 향후 검진결과 연계 기능에 관한 안내 받기</span></label><details><summary>상세 안내</summary><p>이 선택은 향후 기능 안내에 대한 관심표시이며, 현재 검진결과를 분석하거나 제3자에게 제공하는 동의가 아닙니다. 실제 알림 발송이나 결과 기반 개인화는 해당 목적과 수신 방식에 관한 별도 적법한 동의 절차가 갖춰진 경우에만 진행합니다.</p></details></div></div><div class="footactions">${btn('← 예약 완료로',"goto('complete')",'')} ${btn('내 주변 병원 살펴보기 →',"goto('hospitallist')",'primary')}</div></div></div>`}
function hospitallist(){const p=PRODUCTS.find(x=>x.id===state.product),h=HOSP.find(x=>x.id===p.hid);return `<div class="narrow">${crumb(['예약 완료','주변 의료기관 정보'])}<div class="titleblock"><div><h2>${h.region} 지역 주변 의료기관 찾기</h2><p>검진기관 ${h.name} 주변의 진료과목·기관정보를 확인하세요.</p></div></div><div class="panel"><div class="pillrow"><span class="chip on">전체 진료과목</span><span class="chip">내과</span><span class="chip">정형외과</span><span class="chip">가정의학과</span></div>${[{name:'예시 내과의원',dept:'내과',distance:'1.2km',tier:'의원'},{name:'예시 종합병원',dept:'내과 · 가정의학과',distance:'2.4km',tier:'종합병원'},{name:'예시 정형외과의원',dept:'정형외과',distance:'3.1km',tier:'의원'}].map(x=>`<div class="referral"><div class="rowBetween"><div><b>${x.name}</b>　<span class="badge">${x.tier}</span><div class="mini muted">${x.dept} · 거리 ${x.distance}</div></div>${btn('기관정보',"toast('의료기관 상세정보 연계 전입니다.')",'small')}</div></div>`).join('')}<div class="legal section">개별 건강상태에 필요한 의료기관이라는 판단이 아니며, 제공기관·거리·진료과목은 기관 정보는 실제 연계 시 최신 정보를 확인합니다.</div><div class="footactions">${btn('← 예약 완료로',"goto('complete')",'')}</div></div></div>`}
function productconsent(){return `<div class="narrow">${crumb(['예약 완료','건강관리 상품'])}<div class="titleblock"><div><span class="badge blue">비타몰 건강관리 상품</span><h2>이런 상품은 어떠세요?</h2><p>요즘 많이 찾는 비타몰 상품을 먼저 살펴보고, 나에게 꼭 맞는 건강관리 상품을 찾아보세요!</p></div></div><div class="panel"><div class="preview-hero shop-preview"><div class="preview-icon">🛍️</div><div><strong>일상 속 건강관리를 더 편리하게</strong><p>측정 기능부터 기록 방법까지, 내게 필요한 기능을 기준으로 비교해보세요.</p></div></div><div class="preview-section"><div class="rowBetween"><b>비타몰에서 살펴볼 건강관리 상품</b><span class="mini muted">제품 유형</span></div><div class="product-preview-grid"><div class="preview-product"><span>🩺</span><b>가정용 혈압계</b><small>측정·기록 기능 확인</small></div><div class="preview-product"><span>⚖️</span><b>체중계</b><small>측정·연동 기능 비교</small></div><div class="preview-product"><span>⌚</span><b>활동량계</b><small>걷기·활동 기록</small></div></div></div><div class="gentle-note"><b>나에게 꼭 맞는 상품, 이렇게 찾아보세요</b><p>관심 카테고리를 골라 제품별 특징과 사용 편의성을 비교해보세요. 건강검진 결과를 근거로 특정 상품 구매가 필요하다고 판단하지 않습니다.</p></div><div class="consentWrap section"><b>광고성 정보 수신 동의 <span class="mini muted">선택</span></b><p class="mini muted">새로운 상품이나 혜택 소식을 받고 싶을 때만 선택하세요. 동의하지 않아도 모든 일반 상품정보를 살펴볼 수 있습니다.</p><div class="compactconsent"><label><input type="checkbox" ${state.productConsent.marketing?'checked':''} onchange="state.productConsent.marketing=this.checked"><span>[선택] 비타몰 상품 혜택·프로모션 등 광고성 정보 수신 동의</span></label><details><summary>동의 내용 보기</summary><p>광고성 정보 발송 주체, 연락처 이용 목적, 발송 채널, 보유기간 및 철회 방법은 실제 서비스 적용 전에 구체적으로 고지하고 별도 동의를 받습니다. 건강검진 결과를 마케팅 타기팅에 사용하지 않습니다.</p></details></div></div><div class="footactions">${btn('← 예약 완료로',"goto('complete')",'')} ${btn('비타몰 상품 살펴보기 →',"goto('productlist')",'primary')}</div></div></div>`}
function productlist(){return `<div class="narrow">${crumb(['예약 완료','건강관리 상품 탐색'])}<div class="titleblock"><div><h2>건강관리 상품 정보</h2><p>관심 제품의 기능과 활용방법을 비교해 보세요.</p></div></div><div class="panel"><div class="servicecards">${[{icon:'🩺',title:'가정용 혈압계',detail:'측정 방식 · 커프 크기 · 기록 기능',price:'가격 확인'},{icon:'⚖️',title:'체중계',detail:'측정 범위 · 연동 기능 · 사용편의',price:'가격 확인'},{icon:'⌚',title:'활동량계',detail:'걸음 수 · 활동 시간 · 배터리',price:'가격 확인'},{icon:'📒',title:'건강 기록 도구',detail:'생활습관 기록 · 건강목표 관리',price:'정보 확인'}].map(x=>`<div class="servicecard"><div class="ico">${x.icon}</div><h3>${x.title}</h3><p>${x.detail}</p>${btn(x.price,"toast('제품 상세는 추후 제휴 데이터 연계 예정입니다.')",'soft')}</div>`).join('')}</div><div class="legal section">상품의 실제 판매정보는 제휴처의 정보를 기준으로 제공합니다. 의료기기 광고 규정과 건강정보 기반 맞춤형 광고 적법성 검토 후 실제 제휴상품을 연결합니다.</div><div class="footactions">${btn('← 예약 완료로',"goto('complete')",'')}</div></div></div>`}
function modal(body){document.getElementById('modalbody').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function resetAll(){state.selectedCodes=[];state.basicCodes=[];state.deepCodes=[];state.interests=[];state.questionConsent=false;state.filtered=false;state.bookingComplete=false;state.booking={name:'체험 사용자',date:'',phone:''};state.resultLinked=false;goto('home')}
function render(){const pages={home,examselect,complete,hospitalconsent,hospitallist,productconsent,productlist};document.getElementById('app').innerHTML=(pages[state.page]||home)();drawHelper()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modal').classList.contains('open'))closeModal();else if(helperPage)closeHelper()}});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script></body></html>
